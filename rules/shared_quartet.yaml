- id: validate_no_overlaps_or_overfull_measures
  title: Reject overlaps and overfull measures
  scope: validation
  priority: hard
  action: validate_no_overlaps_or_overfull_measures
  parameters:
    reject_overlapping_source_events_per_target: true
    reject_overfull_bars: true
    report_parse_issues: true
  rationale: 'Overlaps and overfull measures are structural errors rather than aesthetic tradeoffs, because they break downstream MusicXML review.

    '
  evidence:
    docs:
    - path: docs/reduction_process_overview.md
      note: Audit checks convert repeated review problems into repeatable constraints.
    code: []
    reports:
    - path: outputs/reports/part_coherence_parse_issues.tsv
      note: Observed overlap/parse failures.
    examples: []
