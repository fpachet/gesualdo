version: 1
name: shared_quartet
description: 'Shared operational constraints for reducing vocal or vocal-style sources to a four-part string quartet target.

  '
target_ensemble: string_quartet
source_idiom: shared_vocal_polyphony
imports: []
metadata:
  generated_from_project: gesualdo
  generated_date: '2026-07-04'
  extraction_status: draft
  source_files_inspected:
  - docs/reduction_rules.md
  - docs/reduction_process_overview.md
passes:
- id: parse_source_events
  description: Parse source parts into timed note/rest events with stable provenance.
- id: choose_global_transposition
  description: Choose a score-level transposition before part assignment.
- id: assign_target_parts
  description: Assign source events to quartet parts while respecting range and continuity.
- id: complete_measures
  description: Split events at barlines, fill rests, and reject overfull or overlapping measures.
- id: cleanup_notation
  description: Prepare MusicXML for review and MuseScore import.
priorities:
  hard_constraints:
  - require_four_quartet_parts
  - require_source_event_or_editorial_tag
  - validate_no_overlaps_or_overfull_measures
  - complete_measures_with_rests
  optimization_pressures:
  - prefer_target_sweet_spots
  - prefer_pitch_class_preserving_octaves
  - avoid_high_borrowed_bottom_register
  optional_enrichments:
  - emit_editorial_dynamics_when_enabled
rules:
- id: require_four_quartet_parts
  title: Require four quartet parts
  scope: validation
  priority: hard
  action: require_target_parts
  parameters:
    parts:
    - violin_1
    - violin_2
    - viola
    - cello
    order_is_canonical: true
  rationale: 'The output is a string quartet reduction, so later assignment, validation, and review checks assume exactly these four target parts.

    '
  evidence:
    docs:
    - path: docs/reduction_rules.md
      note: Defines the quartet target as Violin I, Violin II, Viola, and Cello.
    code: []
    reports: []
    examples: []
  exceptions: []
- id: define_instrument_ranges
  title: Define instrument ranges
  scope: instrument_range
  priority: hard
  action: require_pitch_within_target_range_after_octave_fitting
  parameters:
    midi_ranges:
      violin_1:
      - 55
      - 100
      violin_2:
      - 55
      - 88
      viola:
      - 48
      - 88
      cello:
      - 36
      - 72
    allow_octave_displacement: true
    preserve_pitch_class: true
  rationale: 'Source pitches may be moved by octave, but emitted pitches must remain playable for the assigned quartet instrument.

    '
  evidence:
    docs:
    - path: docs/reduction_rules.md
      note: Range and register are core constraints.
    code: []
    reports: []
    examples: []
  exceptions: []
- id: define_preferred_registers
  title: Define preferred registers
  scope: instrument_sweet_spot
  priority: high
  action: increase_cost_outside_preferred_register
  parameters:
    preferred_registers:
      violin_1:
      - 67
      - 96
      violin_2:
      - 60
      - 88
      viola:
      - 48
      - 72
      cello:
      - 36
      - 60
    range_is_hard_limit: true
    register_fit_score:
      inside_preferred_register: abs(pitch - preferred_center) / 100
      outside_preferred_register: distance_to_nearest_preferred_boundary + 1
      purpose: local target assignment register cost
    preferred_register_fit_cost:
      pitch_sweetspot_cost:
        center_cost: abs(pitch - preferred_center) / preferred_span
        inside_register_cost: center_cost * 0.5
        outside_register_cost: distance_outside_preferred_register
        total: register_cost + center_cost
      octave_displacement_weight: 2.0
      previous_pitch_continuity_weight: 1.0
  rationale: 'A pitch can be technically in range but still sit poorly on the instrument; preferred registers make this cost explicit.

    '
  evidence:
    docs:
    - path: docs/reduction_rules.md
      note: Discusses preferred register as instrumental sweet-spot modeling.
    code: []
    reports: []
    examples: []
  exceptions: []
- id: avoid_high_borrowed_bottom_register
  title: Avoid high borrowed bottom register
  scope: borrowing
  priority: high
  action: reject_high_borrowed_bottom_events
  parameters:
    target_role: bottom
    borrowed_event_definition:
      target_has_anchor_source_parts: true
      borrowed_when_event_source_part_not_in_target_anchor_source_parts: true
      anchor_source_parts_are_initial_target_source_parts: true
    preferred_register_ceiling:
      target: cello
      midi: 60
      note: C4
      source: target preferred register high boundary
    reject_when:
      target_role_is_bottom: true
      event_is_borrowed_from_non_anchor_source_part: true
      event_pitch_midi_greater_than_preferred_register_ceiling: true
    allow_when:
      event_belongs_to_bottom_target_anchor_source_part: true
      event_after_octave_fitting_is_within_instrument_range: true
    duplicate_pitch_class_subrule:
      reject_high_borrowed_duplicate_pitch_classes: true
      duplicate_pitch_class_ceiling_midi: 60
      applies_even_when_duplicate_would_improve_voice_count: true
    selection_stage:
      applies_during_primary_and_supporting_event_assignment: true
      applies_before_final_fragment_pruning: true
      does_not_lower_or_revoice_the_candidate: true
    implementation_note_for_clean_room:
      symbolic_test: "A bottom-target candidate is illegal if it comes from a source part that was not assigned as the bottom anchor and its fitted pitch is above MIDI 60."
      musical_goal: "Use cello for bass function and real low-line continuity, not as spare high-register capacity for upper or middle voices."
  rationale: A resting or borrowable cello may carry real source material, but borrowed upper or middle material above the cello preferred register damages bass function and usually adds less information than it costs in color and readability.
  evidence:
    docs:
    - path: docs/reduction_rules.md
      note: States that outer/bottom source identity and cello sweet spot are structural reduction constraints.
    code: []
    reports: []
    examples:
    - piece_id: synthetic_gesualdo_voice_preservation
      note: A borrowed alto C5 should not be assigned to cello when the true bass anchor is a lower source line.
  exceptions:
  - id: true_bottom_anchor_material
    description: The actual lowest source voice may still be placed in cello and octave-fitted according to range/register rules.
- id: require_source_event_or_editorial_tag
  title: Preserve source provenance
  scope: provenance
  priority: hard
  action: require_source_event_or_editorial_tag
  parameters:
    source_fields:
    - source_id
    - source_part_index
    - source_event_index
    - source_pitch_midi
    generated_field: generated
    editorial_tags_required: true
  rationale: 'Reviewable reductions must distinguish real source-derived notes from generated editorial support material.

    '
  evidence:
    docs:
    - path: docs/reduction_rules.md
      note: Requires source and editorial material to remain distinguishable.
    code: []
    reports: []
    examples: []
  exceptions: []
- id: preserve_source_timing_identity
  title: Preserve source timing identity
  scope: source_event_model
  priority: hard
  action: preserve_attacks_durations_and_pitch_classes
  parameters:
    preserve_attack_offsets: true
    preserve_durations: true
    preserve_pitch_classes: true
    allow_barline_split_with_tie: true
    allow_octave_displacement: true
  rationale: 'The reducer transforms instrumentation, not the source rhythm or harmonic pitch-class content, unless a specific cleanup rule says otherwise.

    '
  evidence:
    docs:
    - path: docs/reduction_rules.md
      note: 'General principle: preserve rhythm, attacks, durations, and pitch classes.'
    code: []
    reports: []
    examples: []
  exceptions:
  - id: narrow_midi_artifact_cleanup
    description: 'Tiny MIDI import artifacts may be normalized by explicit cleanup rules.

      '
- id: complete_measures_with_rests
  title: Complete measures with rests
  scope: validation
  priority: hard
  action: fill_unassigned_measure_time_with_rests
  parameters:
    split_events_at_barlines: true
    validate_measure_duration: true
    max_denominator: 4096
  rationale: 'Exported parts must be exactly measured so MusicXML import and PDF review do not inherit rhythmic gaps or overfull bars.

