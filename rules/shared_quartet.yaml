    examples: []
  exceptions: []
- id: emit_editorial_dynamics_when_enabled
  title: Emit editorial dynamics only when enabled
  scope: editorial_generation
  priority: optional
  action: generate_bar_level_editorial_dynamics
  parameters:
    default_enabled_for_shared_ensemble: true
    phrase_bars: 4
    hairpin_bars: 2
    levels:
    - p
    - mp
    - mf
    - f
    energy_features:
    - active_part_count
    - attack_density
    - average_register
    - registral_span
    energy_weights:
      active_part_count: 0.35
      attack_density: 0.3
      average_register: 0.2
      registral_span: 0.15
  rationale: 'Dynamics are editorial performance suggestions, not source facts, so they must remain optional and clearly separable from note reduction.

    '
  evidence:
    docs:
    - path: README.md
      note: Documents the editorial dynamics layer and ReductionConfig parameters.
    code: []
    reports: []
    examples:
    - piece_id: data/kdf/examples/dynamic
      note: Generated dynamic examples for review.
  exceptions:
  - id: take6_default_disables_dynamics
    description: 'Take 6 reductions disable generated dynamics by default because they implied unsupported interpretation.

      '
validation:
  required_checks:
  - schema_valid
  - unique_rule_ids
  - imported_rule_files_exist
  - evidence_paths_checked
  expected_metrics:
  - part_count
  - measure_count_by_part
  - global_transposition
  - cleanup_report_counts
